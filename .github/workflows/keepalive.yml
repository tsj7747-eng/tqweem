name: Keep Supabase Alive
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          CFG=$(curl -s https://tsj7747-eng.github.io/tqweem/config.js)
          URL=$(echo "$CFG" | grep -oP 'SUPABASE_URL:\s*"\K[^"]+' | head -1)
          KEY=$(echo "$CFG" | grep -oP 'SUPABASE_ANON_KEY:\s*"\K[^"]+' | head -1)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/evidence_template?select=ord&limit=1" -H "apikey: $KEY")
          echo "Status: $CODE"
          [ "$CODE" = "200" ]
